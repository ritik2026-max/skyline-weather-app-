<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyline — Weather Lookup</title>
<style>
  :root{
    --bg-top: #DCE8F0;
    --bg-bottom: #F4F7F5;
    --ink: #1B2733;
    --muted: #5C6B78;
    --card: #FFFFFF;
    --line: #DCE3E8;
    --accent: #2C6E8E;
    --accent-soft: #E4EFF4;
    --warm: #C97A3D;
    --error-bg: #F6E4DF;
    --error-ink: #8A3E24;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 55%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    justify-content:center;
    padding:56px 20px;
  }
  .app{
    width:100%;
    max-width:480px;
  }
  header{
    margin-bottom:26px;
  }
  .eyebrow{
    font-size:14px;
    color:var(--muted);
    margin:0 0 4px 0;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:400;
    font-size:32px;
    margin:0 0 6px 0;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--muted);
    font-size:15px;
    margin:0;
  }
  .search-row{
    display:flex;
    gap:8px;
    margin-bottom:24px;
  }
  #cityInput{
    flex:1;
    padding:13px 16px;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:15px;
    background:var(--card);
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  #cityInput:focus{ border-color:var(--accent); }
  #searchBtn{
    padding:13px 20px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  #searchBtn:hover{ opacity:.92; }
  #searchBtn:disabled{ opacity:.6; cursor:default; }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px 26px;
    min-height:180px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .placeholder{
    color:var(--muted);
    font-size:14px;
    text-align:center;
  }
  .location{
    font-size:18px;
    font-weight:600;
    margin-bottom:2px;
  }
  .updated{
    font-size:13px;
    color:var(--muted);
    margin-bottom:18px;
  }
  .temp-row{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:18px;
  }
  .temp{
    font-family:Georgia,"Times New Roman",serif;
    font-size:56px;
    color:var(--warm);
    line-height:1;
  }
  .condition{
    font-size:16px;
    color:var(--ink);
  }
  .details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    border-top:1px solid var(--line);
    padding-top:16px;
  }
  .detail-item .label{
    font-size:12px;
    color:var(--muted);
    margin-bottom:2px;
  }
  .detail-item .value{
    font-size:15px;
    font-weight:600;
  }
  .error{
    background:var(--error-bg);
    color:var(--error-ink);
    padding:14px 16px;
    border-radius:10px;
    font-size:14px;
  }
  .recent{
    margin-top:18px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    background:var(--accent-soft);
    color:var(--accent);
    border:none;
    padding:6px 14px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
  }
  .chip:hover{ opacity:.85; }
  footer{
    margin-top:22px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <p class="eyebrow">Skyline</p>
    <h1>Check the weather</h1>
    <p class="sub">Search any city, anywhere.</p>
  </header>

  <div class="search-row">
    <input id="cityInput" type="text" placeholder="Enter a city name…">
    <button id="searchBtn">Search</button>
  </div>

  <div class="card" id="resultCard">
    <p class="placeholder">Search for a city to see the current weather.</p>
  </div>

  <div class="recent" id="recentRow"></div>

  <footer>Data from Open-Meteo — free, no API key required.</footer>
</div>

<script>
  const cityInput = document.getElementById("cityInput");
  const searchBtn = document.getElementById("searchBtn");
  const resultCard = document.getElementById("resultCard");
  const recentRow = document.getElementById("recentRow");

  const RECENT_KEY = "skyline_recent_v1";

  const WEATHER_CODES = {
    0: "Clear sky", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast",
    45: "Fog", 48: "Depositing rime fog",
    51: "Light drizzle", 53: "Drizzle", 55: "Dense drizzle",
    61: "Light rain", 63: "Rain", 65: "Heavy rain",
    71: "Light snow", 73: "Snow", 75: "Heavy snow",
    80: "Rain showers", 81: "Rain showers", 82: "Violent rain showers",
    95: "Thunderstorm", 96: "Thunderstorm with hail", 99: "Thunderstorm with heavy hail"
  };

  function getRecent(){
    try{ return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; }
    catch(e){ return []; }
  }

  function saveRecent(city){
    let list = getRecent().filter(c => c.toLowerCase() !== city.toLowerCase());
    list.unshift(city);
    list = list.slice(0, 5);
    localStorage.setItem(RECENT_KEY, JSON.stringify(list));
    renderRecent();
  }

  function renderRecent(){
    const list = getRecent();
    recentRow.innerHTML = "";
    list.forEach(city => {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = city;
      chip.addEventListener("click", () => {
        cityInput.value = city;
        search();
      });
      recentRow.appendChild(chip);
    });
  }

  function showError(msg){
    resultCard.innerHTML = `<div class="error">${msg}</div>`;
  }

  function showLoading(){
    resultCard.innerHTML = `<p class="placeholder">Loading…</p>`;
  }

  async function search(){
    const city = cityInput.value.trim();
    if(!city){ showError("Please type a city name."); return; }

    showLoading();
    searchBtn.disabled = true;

    try{
      const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
      const geoData = await geoRes.json();

      if(!geoData.results || geoData.results.length === 0){
        showError(`Couldn't find "${city}". Try a different spelling or a nearby bigger city.`);
        return;
      }

      const place = geoData.results[0];
      const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=auto`);
      const weatherData = await weatherRes.json();

      if(!weatherData.current){
        showError("Could not load weather data. Please try again.");
        return;
      }

      renderWeather(place, weatherData.current);
      saveRecent(place.name);

    }catch(err){
      showError("Something went wrong. Check your internet connection and try again.");
    }finally{
      searchBtn.disabled = false;
    }
  }

  function renderWeather(place, current){
    const condition = WEATHER_CODES[current.weather_code] || "Unknown";
    const locationLabel = [place.name, place.admin1, place.country].filter(Boolean).join(", ");
    const time = new Date(current.time);
    const timeLabel = time.toLocaleString(undefined, { hour: "2-digit", minute: "2-digit", day: "numeric", month: "short" });

    resultCard.innerHTML = `
      <div class="location">${locationLabel}</div>
      <div class="updated">Updated ${timeLabel}</div>
      <div class="temp-row">
        <span class="temp">${Math.round(current.temperature_2m)}°C</span>
        <span class="condition">${condition}</span>
      </div>
      <div class="details">
        <div class="detail-item">
          <div class="label">Humidity</div>
          <div class="value">${current.relative_humidity_2m}%</div>
        </div>
        <div class="detail-item">
          <div class="label">Wind speed</div>
          <div class="value">${current.wind_speed_10m} km/h</div>
        </div>
      </div>
    `;
  }

  searchBtn.addEventListener("click", search);
  cityInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter") search();
  });

  renderRecent();
</script>

</body>
</html>
